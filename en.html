<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blue Hour Myeongdo</title>
<style>
:root{
  --bg:#070b14; --bg-2:#0c1424; --bg-3:#111c31; --line:#1d2a42; --line-2:#2a3a58;
  --ink:#e6ecf5; --ink-2:#c7d2e3; --muted:#8a99b2; --dim:#6f809c;
  --accent:#ffa24a; --accent-deep:#e8892f; --accent-ink:#1a0f02;
  --on:#7fdcd2; --blue:#3f74c9;
  --paper:#ffffff; --paper-2:#f3f5f8; --paper-ink:#111318; --paper-muted:#6b7280; --paper-line:#e1e5eb; --paper-ground:#eceef2; --warm:#f5f2ea;
  --stamp:#c43a2e; --stamp-b:#2d4f9e; --danger:#ff6b6b;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Noto Sans KR","Segoe UI",Roboto,system-ui,sans-serif;
  --serif:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Noto Sans KR","Segoe UI",Roboto,system-ui,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Noto Sans KR","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --gutter:18px;
}
[hidden]{display:none!important}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body.paper-mode{background:var(--paper-ground)}
#app{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:0 var(--gutter) 56px;min-height:100%}
#snow{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.7;transition:opacity .8s}
body.paper-mode #snow,body.dark-mode #snow{opacity:0}
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 60%,rgba(40,90,190,0) 30%,rgba(30,70,170,.85) 100%);opacity:0;transition:opacity 1.2s}
body.paper-mode #veil{mix-blend-mode:multiply}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.fade{animation:fade .5s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.ticker span{animation:none!important}.cue i{animation:none}.p-timer{transition:none!important}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:4px;border:1px solid var(--line-2);background:var(--bg-2);color:var(--ink);font-family:var(--sans);font-weight:500;font-size:15px;letter-spacing:.01em;transition:background .15s,border-color .15s,transform .06s,opacity .15s;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.solid:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.outline{background:transparent}
.btn.text{background:transparent;border-color:transparent;color:var(--muted);padding:0 10px}
.btn.text:hover{color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

#hud{position:sticky;top:0;z-index:5;margin:0 calc(-1*var(--gutter)) 6px;padding:calc(10px + env(safe-area-inset-top,0px)) calc(var(--gutter) + 44px) 10px var(--gutter);display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(var(--bg) 78%,transparent);font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
body.paper-mode #hud{background:linear-gradient(var(--paper-ground) 78%,transparent);color:#5a5e68}
#hud .m{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
#hud .m label{font-size:10px;text-transform:uppercase;letter-spacing:.14em;opacity:.7}
#hud .m b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
#hud .m b.d{color:var(--accent)}
body.paper-mode #hud .m b{color:#17181c}
body.paper-mode #hud .m b.d{color:#b5541c}
#hud .bar{display:inline-block;width:56px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;vertical-align:middle}
body.paper-mode #hud .bar{background:#d3d7de}
#hud .bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#7aa6ff);transition:width .6s}
#h-att-dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line-2);margin-left:4px;vertical-align:middle}
#h-att-dots i.on{background:var(--accent)}
#hud{gap:4px 12px}
#hud .m:first-child{flex-basis:100%}
#hud .m:not(:first-child){font-size:10.5px;letter-spacing:0}
#hud .m:not(:first-child) label{letter-spacing:.1em}
#hud .bar{width:44px}
#menu-btn{background:rgba(7,11,20,.35);border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}

#menu-btn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:rgba(7,11,20,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0}
#menu-btn span{display:block;width:16px;height:2px;background:currentColor;box-shadow:0 -5px 0 currentColor,0 5px 0 currentColor;border-radius:1px}
body.paper-mode #menu-btn{background:rgba(255,255,255,.5);color:#111318;border-color:transparent}
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(3,6,12,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;background:var(--bg-2);border:1px solid var(--line-2);border-bottom:0;border-radius:14px 14px 0 0;padding:18px var(--gutter) calc(20px + env(safe-area-inset-bottom,0px));animation:up .25s ease both}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 4px}
.sheet .save{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;margin:0 0 14px}
.sheet .list{display:flex;flex-direction:column;gap:8px}
.sheet .btn{justify-content:flex-start;width:100%}
.sheet .confirm{margin-top:8px;padding:12px 14px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg-3);font-size:14px;color:var(--ink-2)}
.sheet .confirm .row{margin-top:10px}
.sheet .credit{font-family:var(--mono);font-size:11px;color:var(--dim);margin:14px 0 0;line-height:1.8}
.sheet a{color:var(--muted)}

.title{padding-block:0 30px}
.hero{position:relative;margin:0 calc(-1*var(--gutter));height:min(64vw,400px);background-size:cover;background-position:center 28%}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,20,.05) 0%,rgba(7,11,20,0) 40%,var(--bg) 100%)}
.title .eyebrow{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-top:6px}
.title h1{font-family:var(--display);font-weight:700;font-size:clamp(44px,12vw,80px);line-height:.95;margin:8px 0 0;letter-spacing:-.03em}
.title h1 span{display:block;font-family:var(--display);font-weight:500;font-size:.3em;letter-spacing:.22em;color:var(--accent);margin-top:14px;padding-left:.05em}
.title .rule{width:40px;height:1px;background:var(--line-2);margin:24px 0 18px}
.title .quote{font-family:var(--serif);color:var(--ink-2);font-size:17px;line-height:1.85;margin:0 0 14px;max-width:30ch;text-wrap:balance}
.title .promise{font-family:var(--sans);color:var(--ink);font-size:15px;margin:0 0 22px;max-width:32ch}
.title .actions{display:flex;flex-wrap:wrap;gap:10px}
.title .fine{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:28px;line-height:1.9;letter-spacing:.02em}
.title .langs{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:14px}
.title .langs a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-2)}
.title .langs b{color:var(--ink);font-weight:500}

.narr{min-height:calc(100vh - 80px);min-height:calc(100svh - 80px);display:flex;flex-direction:column;justify-content:center;cursor:pointer;padding-block:40px 90px;position:relative}
.narr-text{font-family:var(--display);font-weight:400;font-size:clamp(20px,5vw,25px);line-height:1.75;letter-spacing:-.01em;max-width:26ch;text-wrap:pretty;margin:0;color:var(--ink)}
.cue{position:absolute;left:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.08em;display:flex;align-items:center;gap:10px}
.cue i{display:block;width:6px;height:6px;border-right:1px solid var(--dim);border-bottom:1px solid var(--dim);transform:rotate(45deg);animation:nod 1.6s ease-in-out infinite}
@keyframes nod{0%,100%{transform:translateY(0) rotate(45deg);opacity:.5}50%{transform:translateY(4px) rotate(45deg);opacity:1}}
.law{font-family:var(--mono);font-size:13.5px;line-height:1.85;background:var(--warm);color:var(--paper-ink);padding:22px 22px 18px;border-radius:2px;max-width:42ch;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.law b{display:block;font-size:10px;letter-spacing:.18em;color:var(--paper-muted);margin-bottom:10px;font-weight:500}
.law strong{font-size:30px;font-weight:500;letter-spacing:-.02em}
.law .law-note{display:block;margin-top:10px;font-family:var(--serif);color:#3a3d45;font-size:14px}
.narr .after-law{font-family:var(--display);margin:24px 0 0;font-size:18px;color:var(--muted)}

.field{display:flex;flex-direction:column;gap:14px;margin-top:26px;max-width:34ch}
.field input,.field textarea{font:inherit;font-family:var(--display);font-size:22px;background:transparent;border:0;border-bottom:1px solid var(--line-2);color:var(--ink);padding:8px 0;border-radius:0;width:100%}
.field input::placeholder,.field textarea::placeholder{color:var(--dim)}
.field textarea{font-family:var(--serif);font-size:17px;line-height:1.8;min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;max-width:46ch}
.chip{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);font-size:15px}
.chip:hover{border-color:var(--muted);color:var(--ink)}
.chip.ghost{border-style:dashed;color:var(--muted)}

.scene{padding-block:0 12px;min-height:calc(100svh - 72px);cursor:pointer}
.backdrop{position:relative;margin:0 calc(-1*var(--gutter)) 14px;height:min(52vw,320px);background-size:cover;background-position:center}
.backdrop:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,20,.12) 0%,rgba(7,11,20,0) 42%,var(--bg) 100%)}
body.paper-mode .backdrop:after{background:linear-gradient(180deg,rgba(236,238,242,0) 40%,var(--paper-ground) 100%)}
.scene-h{margin-bottom:16px}
.scene-h h2{font-family:var(--display);font-weight:500;font-size:24px;margin:0;letter-spacing:-.01em}
.scene-h .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;margin:4px 0 0}
.log{display:flex;flex-direction:column;gap:20px;padding-bottom:10px}
.line{max-width:58ch;display:grid;grid-template-columns:0 1fr;column-gap:0}
.line.npc,.line.on{grid-template-columns:44px 1fr;column-gap:12px}
.line .who{grid-column:2;font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--muted);margin-bottom:5px;text-transform:uppercase}
.line.on .who{color:var(--on)}
.line.npc .who{color:var(--accent)}
.line .txt{grid-column:2;margin:0;font-family:var(--serif);font-size:16.5px;line-height:1.75;letter-spacing:-.005em;text-wrap:pretty;color:var(--ink)}
.line.on .txt{color:#d9f4f1;background:rgba(127,220,210,.06);border:1px solid rgba(127,220,210,.16);border-radius:14px 14px 14px 4px;padding:12px 15px;font-size:17px}
.line.on .txt:empty:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--on);box-shadow:12px 0 0 var(--on),24px 0 0 var(--on);animation:dots 1s ease-in-out infinite;margin:6px 0}
@keyframes dots{0%,100%{opacity:.25}50%{opacity:1}}
.line.narr-line .txt{color:var(--muted);font-size:16px}
.line.me .txt{color:var(--ink-2);font-family:var(--sans);font-size:16px;background:var(--bg-3);border:1px solid var(--line);border-radius:14px 14px 4px 14px;padding:10px 14px;display:inline-block}
.line.me .who{color:var(--ink-2)}
.line .portrait{grid-column:1;grid-row:1/span 2;width:44px;height:56px;object-fit:cover;object-position:top;border-radius:3px;border:1px solid var(--line-2);background:var(--bg-2)}
.line .on-dot{grid-column:1;grid-row:1/span 2;width:44px;height:56px;display:flex;align-items:center;justify-content:center}
.line .on-dot i{display:block;width:12px;height:12px;border-radius:50%;background:var(--on);box-shadow:0 0 18px 4px rgba(127,220,210,.45);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.25);opacity:1}}
@media (prefers-reduced-motion:reduce){.line .on-dot i{animation:none}}
.ctl{position:sticky;bottom:0;display:flex;flex-direction:column;gap:8px;padding:14px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 32%)}
.ctl .next{align-self:stretch;justify-content:flex-end;min-height:48px;padding:0 4px;background:none;border:0;font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;gap:10px}
.ctl .next i{display:block;width:6px;height:6px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg);animation:nod 1.6s ease-in-out infinite}
.ctl .next.typing i{animation:none;opacity:.35}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:10px 14px 10px 16px;text-align:left;background:var(--bg-2);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;font-family:var(--sans);font-size:15.5px;color:var(--ink);line-height:1.5;transition:background .15s,border-color .15s}
.choice:hover{background:var(--bg-3);border-color:var(--line-2);border-left-color:var(--accent)}
.choice:active{transform:translateY(1px)}
.choice.quiet{border-left-color:var(--line-2);color:var(--ink-2)}
.ctl .inrow{display:flex;gap:8px;align-items:stretch}
.ctl .inrow input{flex:1;min-width:0;font:inherit;font-family:var(--serif);font-size:16px;background:var(--bg-2);border:1px solid var(--line);border-bottom-color:var(--line-2);color:var(--ink);padding:10px 12px;border-radius:4px}
.ctl .inrow .choice{width:auto;flex:0 0 auto}

.ticker{overflow:hidden;white-space:nowrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 0;margin:2px 0 6px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em}
.ticker span{display:inline-block;padding-left:100%;animation:tick 32s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}

.evening-h{font-family:var(--display);font-size:24px;font-weight:500;margin:6px 0 0}
.evening-p{color:var(--muted);margin:4px 0 4px;font-size:15px;font-family:var(--serif)}
.evening-hint{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin:0 0 14px;letter-spacing:.02em}
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:1fr 1fr}.tiles .tile.wide{grid-column:1/-1}}
.tile{position:relative;display:block;width:100%;height:124px;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background-size:cover;background-position:center;text-align:left;color:var(--ink)}
.tile:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,11,20,.94) 0%,rgba(7,11,20,.7) 60%,rgba(7,11,20,.25) 100%)}
.tile .t{position:absolute;left:16px;right:20%;bottom:14px;display:flex;flex-direction:column;gap:2px}
.tile .t small{text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tile .t b{font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:-.01em}
.tile .t small{font-family:var(--serif);font-size:13.5px;color:var(--ink-2)}
.tile .cost{position:absolute;top:12px;left:16px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.tile.vote .cost{color:#fff;background:var(--stamp);padding:2px 8px;border-radius:2px}
.tile:hover{border-color:var(--line-2)}
.tile:disabled{cursor:not-allowed;filter:grayscale(1)}
.tile:disabled:before{background:rgba(7,11,20,.85)}
.tile:disabled .t b,.tile:disabled .t small{color:var(--dim)}
.tile:disabled .cost{color:var(--dim);background:transparent}

.term{padding-block:0 20px}
.term-top{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:#6a6e78;text-transform:uppercase;margin:0 0 12px}
.paper{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:2px;padding:24px 22px 28px;border:1px solid var(--paper-line);box-shadow:0 18px 50px rgba(0,0,0,.12);font-family:var(--mono);overflow:hidden}
.paper.batch{box-shadow:0 18px 50px rgba(0,0,0,.12),4px 4px 0 -1px var(--paper-2),8px 8px 0 -2px #e6e9ee}
.p-timer{position:absolute;left:0;top:0;height:3px;width:100%;background:var(--paper-ink);transition:width 20s linear;opacity:.8}
.p-timer.late{background:var(--stamp)}
.doc-head{display:flex;align-items:center;gap:10px;font-size:10.5px;letter-spacing:.12em;color:var(--paper-muted);border-bottom:1px solid var(--paper-line);padding-bottom:12px;margin-bottom:16px;text-transform:uppercase}
.doc-head .tag{border:1px solid var(--paper-line);border-radius:2px;padding:2px 7px;color:var(--paper-ink);letter-spacing:.14em}
.doc-head .no{margin-left:auto;font-variant-numeric:tabular-nums}
.doc-head .late-tag{color:#fff;background:var(--stamp);border-radius:2px;padding:2px 7px;letter-spacing:.14em}
.paper h3{font-family:var(--sans);font-weight:600;font-size:20px;margin:0 0 12px;letter-spacing:-.01em;line-height:1.35}
.p-body{font-size:14.5px;line-height:1.9;margin:0;white-space:pre-line}
.p-basis{font-size:12.5px;line-height:1.8;color:var(--paper-muted);background:var(--paper-2);border-left:2px solid var(--paper-line);margin:16px 0 0;padding:10px 12px}
.p-basis.hide{display:none}
.stamp{position:absolute;right:18px;bottom:18px;font-family:var(--sans);font-weight:700;font-size:30px;letter-spacing:.24em;padding:6px 12px 6px 18px;border:3px solid;border-radius:3px;transform:rotate(-12deg) scale(1.5);opacity:0;pointer-events:none;transition:transform .16s cubic-bezier(.2,1.5,.4,1),opacity .16s;mix-blend-mode:multiply}
.stamp.show{opacity:.86;transform:rotate(-11deg) scale(1)}
.stamp.sign{color:var(--stamp);border-color:var(--stamp)}
.stamp.refuse{color:var(--stamp-b);border-color:var(--stamp-b)}
.term-ctl{display:grid;grid-template-columns:auto 1fr 1.4fr;gap:8px;margin-top:14px}
.term-ctl .btn{min-height:52px;border-radius:3px}
.term-ctl .btn.text{color:#5a5e68}
.term-ctl .btn.outline{background:transparent;border-color:#c9cfd8;color:var(--paper-ink)}
.term-ctl .btn.solid{background:var(--paper-ink);border-color:var(--paper-ink);color:#fff}
.term-ctl .btn.solid:hover{background:#000}
.term-ctl.one{grid-template-columns:1fr}
.term-ctl.three{grid-template-columns:1fr 1fr 1fr}
.term-note{font-family:var(--serif);color:#3a3d45;font-size:15.5px;line-height:1.75;min-height:1.75em;margin:14px 0 0;max-width:46ch}
.summary{font-family:var(--mono);font-size:13.5px;line-height:2.1;color:var(--paper-ink)}
.summary b{font-weight:500;font-size:16px}
.interview{background:#15171d;color:#e6e6e6;border-radius:3px;padding:20px 20px;font-family:var(--mono);font-size:14px;line-height:1.9;margin-top:4px}
.interview .who{font-size:10px;letter-spacing:.18em;color:#9aa;display:block;margin-bottom:8px;text-transform:uppercase}

.diary{padding-block:12vh 20px;min-height:calc(100dvh - 100px);display:flex;flex-direction:column;justify-content:flex-start}
.diary .row{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px))}

<script>
/* ===================== SETTINGS ===================== */
const FEEDBACK_MAILTO = '';   // Enter the email of the maker and a 'Send a letter to the maker' button appears.

const LANGS = [['ko','Korean','./'],['en','English','en.html'],['zh','Chinese','zh.html'],['ja','Japanese','ja.html'],['es','Spanish','es.html']];

const JOBS = {
  'Marketer':{hrv:41, why:'Persuasion stayed. Execution went.'},
  'Developer':{hrv:38, why:'The first field replaced. Only the instinct is left.'},
  'Product Manager':{hrv:40, why:'Problem framing stayed. The documents went.'},
  'Sales':{hrv:47, why:'The field that eats with people. Not replaced yet.'},
  'Designer':{hrv:39, why:'Taste stayed. The hands went.'},
  'Student':{hrv:35, why:'Probability that what you learned disappears: 0.98.'},
  'Self-employed':{hrv:45, why:'You own something. That is everything.'},
  'Civil Servant':{hrv:43, why:'Signing was already the job. The best-prepared field of all.'}
};
const WHY_POOL = [j => `${j}. Judgment stayed. The hands went.`, j => `${j}. Five-year obsolescence estimate: deferred. The only record is that a human still does this.`, j => `${j}. Not replaced. Replacement became unnecessary.`, j => `${j}. Final assessment for this field. No further updates scheduled.`];
const DEFAULT_JOB = j => ({hrv: 36 + ([...String(j)].reduce((a,c) => a + c.charCodeAt(0), 0) % 10), why: WHY_POOL[String(j).length % WHY_POOL.length](j)});

/* ===================== State ===================== */
const $ = s => document.querySelector(s);
const stage = $('#stage'), hud = $('#hud');
const SAVE_KEY = 'bluehour_act1_v2';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let pendT = null, pendI = null;
function later(ms, fn){ clearTimeout(pendT); pendT = setTimeout(fn, reduced ? 200 : ms); }

function fresh(){ return {
  name:'', job:'', day:1, stage:'title',
  hrv:41.0, blue:12, body:70, att:3,

  diary:{}, identity:'an Attestor', flags:{}, ateToday:null, meals:[], voted:null
};}
let S = fresh();

function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem(SAVE_KEY); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function clearSave(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function floorOf(){ return clamp(Math.round(S.hrv/5), 1, 20); }
function T(s){ return String(s).replace(/\{name\}/g, S.name||'Attestor').replace(/\{job\}/g, S.job||'that work'); }
function josa(w, a, b){ w = String(w); const c = w.charCodeAt(w.length-1); if(!(c >= 0xAC00 && c <= 0xD7A3)) return w + b; return w + (((c - 0xAC00) % 28) ? a : b); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }

  hud.hidden = false;
  const dd = DATES[S.day] || DATES[3];

  if(!S.bonds.includes(who)) S.bonds.push(who);

/* ===================== Snow ===================== */

(function snow(){
  const c = $('#snow'), ctx = c.getContext('2d'); let drops = [], W, H;
  function size(){ W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; c.style.width = innerWidth+'px'; c.style.height = innerHeight+'px';
    drops = Array.from({length: Math.round(innerWidth/6)}, (_, i) => ({x:Math.random()*W, y:Math.random()*H, l:(9+Math.random()*22)*devicePixelRatio, v:(7+Math.random()*9)*devicePixelRatio, a:.10+Math.random()*.30, f:i%6===0, r:(.7+Math.random()*1.4)*devicePixelRatio})); }
  addEventListener('resize', size); size();
  let running = false;
  function frame(){
    if(document.hidden || document.body.classList.contains('paper-mode') || document.body.classList.contains('dark-mode')){ running = false; return; }
    ctx.clearRect(0,0,W,H); ctx.lineWidth = 1*devicePixelRatio;
    for(const d of drops){
      if(d.f){ ctx.fillStyle = `rgba(220,236,255,${d.a*.8})`; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fill(); if(!reduced){ d.y += d.v*.18; d.x -= d.v*.03; } }
      else { ctx.strokeStyle = `rgba(150,196,240,${d.a})`; ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - d.l*.16, d.y + d.l); ctx.stroke(); if(!reduced){ d.y += d.v; d.x -= d.v*.16; } }
      if(d.y > H + 8){ d.y = -d.l; d.x = Math.random()*W; }
    }
    if(!reduced) requestAnimationFrame(frame);
  }
  window.kickSnow = () => { if(!running && !reduced){ running = true; requestAnimationFrame(frame); } };
  document.addEventListener('visibilitychange', window.kickSnow);
  running = true; frame();
})();

function track(ev, extra){ if(!TRACK_URL) return; try{ const body = JSON.stringify(Object.assign({ev, t:Date.now(), lang:LANG, name:S.name, job:S.job, hrv:Math.round(S.hrv*10)/10, day:S.day, stage:S.stage, signed:S.signed, read:S.signedRead, refused:S.refused, bonds:S.bonds.length, voted:S.voted, identity:S.identity, visited:(S.flags.visited||[]).length}, extra||{})); if(navigator.sendBeacon){ navigator.sendBeacon(TRACK_URL, new Blob([body], {type:'text/plain'})); } else { fetch(TRACK_URL, {method:'POST', mode:'no-cors', body, keepalive:true}); } }catch(e){} }
function narrate(lines, done, bgs){
  let i = 0; mode('dark'); hud.hidden = true;

    if(i >= lines.length){ done(); return; }
    const l = lines[i++];
    const bgk = bgs && bgs[i-1]; stage.innerHTML = `<section class="narr fade">${bgk ? `<div class="narr-bg" style="background-image:url('img/${bgk}.jpg')"></div>` : ''}${typeof l === 'string' ? `<p class="narr-text">${esc(T(l))}</p>` : l.html}<div class="cue">${(i === 1 && S.stage === 'intro') ? 'Tap anywhere to continue' : 'Continue'}<i></i></div></section>`;

function scene(opts, items, done){
  mode(opts.mode || 'city'); updHUD(opts.att);
  stage.innerHTML = `<section class="scene fade">${opts.bg ? `<div class="backdrop" style="background-image:url('img/${opts.bg}.jpg')"></div>` : ''}<header class="scene-h"><h2>${esc(opts.title)}</h2>${opts.sub ? `<p class="sub">${esc(opts.sub)}</p>` : ''}</header><div class="log" id="log"></div><div class="ctl" id="ctl"></div></section>`;
  stage.querySelector('.scene').onclick = e => { if(e.target.closest('button,input,a,.choice')) return; const b = $('#ctl .next'); if(b) b.click(); };
  try{ const ctlEl = $('#ctl'), logEl = $('#log'); new ResizeObserver(() => { logEl.style.paddingBottom = Math.max(0, ctlEl.offsetHeight - 20) + 'px'; }).observe(ctlEl); }catch(e){}
  scrollTop();
  runSeq(items, done);
}
function runSeq(items, done){
  let i = 0;
  const next = () => {
    if(i >= items.length){ done && done(); return; }
    const it = items[i++];
    if(typeof it === 'function'){ const r = it(); if(Array.isArray(r)) return runSeq(r, next); return next(); }
    if(it.choice) return showChoice(it, opt => { if(opt.fx) opt.fx(opt._val); runSeq(opt.then || [], next); });
    showLine(it, next);
  };
  next();
}
const PORTRAITS = {[NAMES.bak]:'p_bak',[NAMES.sujin]:'p_sujin',[NAMES.hal]:'p_hal',[NAMES.dohyun]:'p_dohyun',[NAMES.sunbae]:'p_sunbae'};
function keepVisible(el){ const ctl = $('#ctl'); if(!el || !ctl) return; const top = el.getBoundingClientRect().bottom + scrollY + ctl.offsetHeight + 8 - innerHeight; if(top > scrollY + 1) window.scrollTo({top, behavior: reduced ? 'auto' : 'smooth'}); }
function showLine(it, next){
  const log = $('#log'), ctl = $('#ctl');
  const cls = it.who === NAMES.on ? 'on' : it.who === NAMES.me ? 'me' : it.who ? 'npc' : 'narr-line';
  const div = document.createElement('div'); div.className = 'line ' + cls;
  const por = PORTRAITS[it.who];
  div.innerHTML = `${por ? `<img class="portrait" src="img/${por}.jpg" alt="">` : it.who === NAMES.on ? `<span class="on-dot"><i></i></span>` : ''}${it.who ? `<span class="who">${esc(it.who)}</span>` : ''}<p class="txt"></p>`;
  log.appendChild(div);
  const p = div.querySelector('.txt'), full = T(it.text); let k = 0, timer = null, finished = false, used = false;
  const btn = document.createElement('button'); btn.className = 'next typing'; btn.innerHTML = '<span>…</span><i></i>';
  const finish = () => { if(finished) return; finished = true; p.classList.remove('typing'); clearInterval(timer); clearTimeout(timer); p.textContent = full; btn.classList.remove('typing'); btn.querySelector('span').textContent = 'Continue'; keepVisible(div); };
  btn.onclick = e => { e.stopPropagation(); if(!finished) return finish(); if(used) return; used = true; next(); };
  ctl.innerHTML = ''; ctl.appendChild(btn);
  const startTyping = () => { p.classList.add('typing'); let lastH = 0; timer = setInterval(() => { k += 1; p.textContent = full.slice(0, k); if(p.offsetHeight !== lastH){ lastH = p.offsetHeight; keepVisible(div); } if(k >= full.length) finish(); }, 22); };
  if(reduced){ finish(); } else if(it.who === NAMES.on){ timer = setTimeout(() => { if(!finished) startTyping(); }, 650); } else { startTyping(); }
  keepVisible(div);
}
function showChoice(it, pick){
  const ctl = $('#ctl'); ctl.innerHTML = '';
  it.choice.forEach(opt => {
    const quiet = opt.label.startsWith('(');
    if(opt.input){
      const row = document.createElement('div'); row.className = 'inrow';
      const inp = document.createElement('input'); inp.placeholder = opt.input; inp.id = 'choice-input-' + Math.random().toString(36).slice(2,7); inp.maxLength = 40; inp.autocomplete = 'off';
      const b = document.createElement('button'); b.className = 'choice'; b.textContent = opt.label;
      const go = () => { const v = inp.value.trim(); if(!v){ inp.focus(); return; } opt._val = v; echo(opt.label.replace('…', v)); pick(opt); };
      b.onclick = go; inp.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
      row.appendChild(inp); row.appendChild(b); ctl.appendChild(row);
    } else {
      const b = document.createElement('button'); b.className = 'choice' + (quiet ? ' quiet' : ''); b.textContent = opt.label;
      b.onclick = () => { echo(opt.label); pick(opt); }; ctl.appendChild(b);
    }
  });
  function echo(label){ if(label.startsWith('(')) return; const div = document.createElement('div'); div.className = 'line me'; div.innerHTML = `<span class="who">${esc(NAMES.me)}</span><p class="txt">${esc(label)}</p>`; $('#log').appendChild(div); }
  keepVisible($('#log').lastElementChild);
}

function N(text){ return {who:null, text}; }

const BATCH = {1:384, 2:378, 3:391};
function buildQueue(){
  const d = S.day, q = [{...CASES.batch, n:BATCH[d]}];
  if(d === 1) q.push(...['pet','loan38','loan91','triage','study','self'].map(k => CASES[k]));
