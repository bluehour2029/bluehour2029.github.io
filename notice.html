<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지원 종료 안내문 · BLUE HOUR 2029</title>

<style>
:root{--bg:#05080f;--bg-2:#0a1220;--line:#172238;--ink:#e8edf6;--muted:#8a97b0;--neon:#5ee7df;--paper:#f2eee6;--paper-ink:#1b1b1f;--paper-muted:#6b6a70;--paper-line:#cfc9bd;--stamp:#b8322f;--keep:#2e6b4f;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,"SF Mono",Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;background:radial-gradient(120% 60% at 50% -10%,#14213a 0%,var(--bg) 60%)}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
header .t{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.lang{display:flex;gap:6px}
.lang button{background:none;border:1px solid var(--line);color:var(--muted);font:600 11px var(--mono);padding:4px 8px;border-radius:999px;cursor:pointer}
.lang button.on{color:var(--neon);border-color:var(--neon)}
h1{font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{background:var(--bg-2);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:9px 13px;font-size:14px;cursor:pointer;min-height:40px}
.chip.on{border-color:var(--neon);color:var(--neon)}
.row{display:flex;gap:8px;margin-bottom:14px}
input{flex:1;min-height:44px;background:var(--bg-2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:0 12px;font:15px var(--sans);outline:none}
input:focus{border-color:var(--neon)}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);color:var(--ink);font:600 14px var(--sans);padding:0 14px;cursor:pointer;white-space:nowrap}
.btn.solid{background:var(--neon);color:#04101a;border-color:var(--neon)}
.btn:disabled{opacity:.45}
.card{position:relative;margin:6px 0 12px;border-radius:6px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);background:var(--paper);aspect-ratio:1080/1350}
.card canvas{width:100%;height:100%;display:block}
.card.empty{display:grid;place-items:center;color:var(--paper-muted);font:13px var(--mono);letter-spacing:.1em}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.actions .wide{grid-column:1/-1}
.note{color:var(--muted);font-size:12px;line-height:1.6}
.note a{color:var(--neon);text-decoration:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f1a2e;border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (min-width:700px){.wrap{max-width:640px;padding-top:34px}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="t">BLUE HOUR 2029 · NOTICE</div><div class="lang"><button data-l="ko">한국어</button><button data-l="en">EN</button></div></header>

<script>
const TRACK_URL = 'https://script.google.com/macros/s/AKfycbzblaRzqByXosYJ1bRfhyqrP82Qx9D9EHR4xbIGAFrRY4dUhcWcADaOZMpqUeWAWDkc/exec';
const GAME_URL = 'https://bluehour2029.github.io/';
const SID = Math.random().toString(36).slice(2, 10);
const SRC = (() => { try{ return new URLSearchParams(location.search).get('src') || ''; }catch(e){ return ''; } })();
const REF = (() => { try{ return document.referrer ? new URL(document.referrer).hostname : ''; }catch(e){ return ''; } })();
function track(ev, extra){ if(!TRACK_URL) return; try{ navigator.sendBeacon(TRACK_URL, new Blob([JSON.stringify(Object.assign({ev, t:Date.now(), sid:SID, lang:L, src:SRC, ref:REF, stage:'notice'}, extra||{}))], {type:'text/plain'})); }catch(e){} }

const JOBS = {
 ko: {

  '요리사':{hrv:52, end:0, why:'아직 있는 일. 사람 조리, 위생 미인증. 아래 동네에서만.'},
  '간병인·요양보호사':{hrv:55, end:0, why:'아직 있는 일. 몸을 만지는 일은 마지막까지 남았다.'},
  '배관공·전기기사':{hrv:57, end:0, why:'아직 있는 일. 파이프는 화면 안에 없다.'}
 },
 en: {
  'Developer':{hrv:31, end:2027, why:'The first field to end. The year code was read best by something that was not a person.'},
  'Lawyer / Accountant':{hrv:33, end:2027, why:'Work done in documents lost to whatever read documents better.'},
  'Doctor':{hrv:42, end:2028, why:'Diagnosis ended first. The hands held out a year longer. A robot arm does not shake.'},
  'Teacher':{hrv:38, end:2027, why:'The children learned better. The adult who stayed in the classroom was called something else.'},
  'Designer':{hrv:36, end:2027, why:'Taste stayed. The hands were inside the screen.'},
  'Marketer':{hrv:41, end:2028, why:'Persuasion stayed. Execution went.'},
  'Product Manager':{hrv:40, end:2028, why:'Problem framing stayed. The documents went.'},
  'Sales':{hrv:47, end:2028, why:'The field that eats with people. The last office job to end.'},
  'Civil Servant':{hrv:43, end:2028, why:'Signing was already the job. The best-prepared field of all.'},
  'Student':{hrv:35, end:2027, why:'It did not end. It never started. Probability that what you learned disappears: 0.98.'},
  'Self-employed':{hrv:45, end:0, why:'The shop is still there. The customers went to the towers.'},
  'Cook':{hrv:52, end:0, why:'Still a job. Human cooking, hygiene uncertified. Only below the towers.'},
  'Caregiver':{hrv:55, end:0, why:'Still a job. Touching a body was the last thing to stay.'},
  'Plumber / Electrician':{hrv:57, end:0, why:'Still a job. Pipes are not inside a screen.'}
 }
};
const HANDS = { ko: /기사|공$|배관|전기|간병|요양|요리|조리|미용|배달|농|어부|목수|정비|간호|보육|청소|운전|기술자|용접|도배|타일|수리/,
                en: /plumb|electric|nurs|care|cook|chef|barber|hair|driver|farm|fish|mechanic|carpent|clean|weld|repair|technician|builder|mason|painter|deliver|garden/i };
const WHY = { ko: [j => `${j}. 판단은 남았고, 손은 사라졌다.`, j => `${j}. 5년 소멸 확률 산정 보류. 사람이 아직 그 일을 한다는 기록만 남았다.`, j => `${j}. 대체되지 않았다. 대체할 필요가 없어졌다.`, j => `${j}. 이 직군의 마지막 산정치. 다음 갱신 예정 없음.`],
              en: [j => `${j}. Judgment stayed. The hands went.`, j => `${j}. Five-year obsolescence estimate: deferred. The only record is that a human still does this.`, j => `${j}. Not replaced. Replacement became unnecessary.`, j => `${j}. Final assessment for this field. No further updates scheduled.`] };
const ALIVE = { ko: j => `${j}. 아직 있는 일. 손이 닿아야 하니까. 일감은 타워로 갔다.`, en: j => `${j}. Still a job. It needs hands. The work went to the towers.` };
function lookup(j){
  const t = JOBS[L][j]; if(t) return t;
  const h = [...String(j)].reduce((a,c) => a + c.charCodeAt(0), 0);
  return HANDS[L].test(String(j)) ? {hrv: 50 + h % 9, end: 0, why: ALIVE[L](j)} : {hrv: 33 + h % 10, end: (h % 2) ? 2027 : 2028, why: WHY[L][String(j).length % 4](j)};
}

const T = {

       ph:'직접 입력 (예: 교사, 작가, 미용사)', go:'안내문 받기', empty:'안내문이 여기에 나옵니다', share:'공유하기', save:'이미지 저장', play:'2029년을 사흘 살아보기 · 20분',
       note:'이 문서는 허구입니다. 실제 기관과 무관합니다. 이름·직업은 서버에 저장되지 않고, 직업명만 집계됩니다. 포맷은 누구나 써도 됩니다(CC BY 4.0 · BLUE HOUR 2029). <a href="./kit.html">키트</a>',
       title:'지원 종료 안내', org:'인간잔여가치 산정실 · 2029.12.21', to:'수신', job:'대상 직군', end:'지원 종료', endNone:'해당 없음 · 아직 있는 일', hrv:'초기 HRV', memo:'산정 메모', basis:'근거', basisV:'인간서명법 제3조', decide:'결정', decideV:'단(斷)', sign:'서명', signNote:'서명은 당신이 합니다.', line:'귀하의 잘못이 아닙니다.', stamp:'지원 종료', keep:'유지', foot:'이 문서는 허구입니다 · BLUE HOUR 2029 · bluehour2029.github.io', yr:'년',
       shareText:j => `${j}. 2029년의 지원 종료 안내문이 왔다. 당신 잘못이 아니라고 한다. 당신 것도 받아 보라.`, copied:'문구와 링크를 복사했습니다', saved:'이미지를 저장했습니다. 길게 눌러 저장할 수도 있습니다', need:'직업을 골라 주세요' },
 en: { h1:'In 2026, what did you do for a living?', sub:'Pick a job and a notice from 2029 comes out. Every job has an end year. It is not your fault.',
       ph:'Type your own (teacher, writer, barber)', go:'Get my notice', empty:'Your notice appears here', share:'Share', save:'Save image', play:'Live three days in 2029 · 20 min',
       note:'This document is fiction and refers to no real agency. Names and jobs are not stored; only the job title is counted. The format is free for anyone (CC BY 4.0 · BLUE HOUR 2029). <a href="./kit.html">Kit</a>',
       title:'NOTICE OF SUPPORT DISCONTINUATION', org:'Office of Residual Human Value · 2029.12.21', to:'To', job:'Field', end:'Support discontinued', endNone:'Not scheduled · still a job', hrv:'Initial HRV', memo:'Assessment note', basis:'Basis', basisV:'Human Attestation Act, Art. 3', decide:'Decision', decideV:'Dan', sign:'Signature', signNote:'You sign.', line:'This is not your fault.', stamp:'DISCONTINUED', keep:'RETAINED', foot:'This document is fiction · BLUE HOUR 2029 · bluehour2029.github.io', yr:'',
       shareText:j => `${j}. My support discontinuation notice from 2029 arrived. It says it is not my fault. Get yours.`, copied:'Text and link copied', saved:'Image saved. You can also long-press it', need:'Pick a job first' }
};

let L = (() => { try{ const q = new URLSearchParams(location.search).get('lang'); if(q === 'ko' || q === 'en') return q; }catch(e){} return (navigator.language || 'ko').toLowerCase().startsWith('ko') ? 'ko' : 'en'; })();
let cur = null, blob = null;
const $ = s => document.querySelector(s);
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2400); }
function ui(){
  const t = T[L]; document.documentElement.lang = L;
  $('#h1').textContent = t.h1; $('#sub').textContent = t.sub; $('#job').placeholder = t.ph; $('#go').textContent = t.go; const em = $('#empty'); if(em) em.textContent = t.empty;
  $('#share').textContent = t.share; $('#save').textContent = t.save; $('#play').textContent = t.play; $('#note').innerHTML = t.note;
  $('#play').href = GAME_URL + (L === 'ko' ? '' : 'en.html') + '?src=notice';
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === L));
  const c = $('#chips'); c.innerHTML = '';
  Object.keys(JOBS[L]).forEach(j => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = j; b.onclick = () => { $('#job').value = j; render(j); }; c.appendChild(b); });
  if(cur) render(cur);
}
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { L = b.dataset.l; ui(); });

function wrap(x, text, maxW, font){ x.font = font; const out = []; const words = text.split(/(\s+)/); let line = '';
  for(const w of words){ const test = line + w; if(x.measureText(test).width > maxW && line){ out.push(line.trimEnd()); line = w.trimStart(); } else line = test; }
  if(line.trim()) out.push(line.trimEnd());
  // long words without spaces (Korean): break by character
  const fin = []; for(const l of out){ if(x.measureText(l).width <= maxW){ fin.push(l); continue; } let s = ''; for(const ch of l){ if(x.measureText(s + ch).width > maxW){ fin.push(s); s = ch; } else s += ch; } if(s) fin.push(s); }
  return fin;
}
function render(job){
  const t = T[L]; const J = lookup(job); cur = job;
  document.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b.textContent === job));
  const W = 1080, H = 1350, M = 80, CW = W - 2 * M; let cv = $('#card canvas'); const card = $('#card');
  if(!cv){ cv = document.createElement('canvas'); cv.width = W; cv.height = H; card.classList.remove('empty'); card.innerHTML = ''; card.appendChild(cv); }
  const x = cv.getContext('2d'); const SANS = '-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif', MONO = 'ui-monospace, Menlo, "SF Mono", Consolas, monospace';
  x.fillStyle = '#f2eee6'; x.fillRect(0, 0, W, H);
  x.globalAlpha = .05; for(let i = 0; i < 1400; i++){ x.fillStyle = i % 2 ? '#000' : '#fff'; x.fillRect(Math.random() * W, Math.random() * H, 2, 2); } x.globalAlpha = 1;
  x.textBaseline = 'top'; x.textAlign = 'left';
  const hash = [...job].reduce((a, c) => a + c.charCodeAt(0), 7) % 9000 + 1000, docNo = `HRA-2029-1221-${hash}`;
  x.fillStyle = '#6b6a70'; x.font = `500 24px ${MONO}`;
  const orgW = x.measureText(t.org).width, docW = x.measureText(docNo).width;
  x.fillText(t.org, M, 84); let hy = 84;
  if(orgW + docW + 40 > CW){ hy = 120; x.fillText(docNo, M, hy); } else { x.textAlign = 'right'; x.fillText(docNo, W - M, 84); x.textAlign = 'left'; }
  const ruleY = hy + 48; x.fillStyle = '#cfc9bd'; x.fillRect(M, ruleY, CW, 2);
  const tf = `700 ${L === 'ko' ? 74 : 58}px ${SANS}`; x.fillStyle = '#1b1b1f'; const tl = wrap(x, t.title, CW, tf); let y = ruleY + 36;
  tl.forEach(l => { x.font = tf; x.fillText(l, M, y); y += L === 'ko' ? 88 : 70; }); y += 22;
  const row = (k, v, big) => { x.fillStyle = '#6b6a70'; x.font = `500 23px ${MONO}`; x.fillText(k.toUpperCase(), M, y); y += 34;
    const f = `${big ? 700 : 500} ${big ? 54 : 38}px ${SANS}`; const lines = wrap(x, v, CW, f); x.fillStyle = '#1b1b1f'; x.font = f; const lh = big ? 64 : 48;
    lines.forEach(l => { x.fillText(l, M, y); y += lh; }); y += 20; };
  row(t.job, job, true);
  row(t.end, J.end ? `${J.end}${t.yr}` : t.endNone, true);
  row(t.hrv, `${J.hrv} / 100`);
  row(t.memo, J.why);
  row(t.basis, t.basisV);
  row(t.decide, t.decideV);
  x.fillStyle = '#6b6a70'; x.font = `500 23px ${MONO}`; x.fillText(t.sign.toUpperCase(), M, y); y += 34;
  x.fillStyle = '#cfc9bd'; x.fillRect(M, y + 40, 440, 2); x.fillStyle = '#6b6a70'; x.font = `400 26px ${SANS}`; x.fillText(t.signNote, M, y + 50); y += 96;
  const lineY = Math.min(Math.max(y + 8, H - 320), H - 196); x.fillStyle = '#1b1b1f'; x.font = `700 42px ${SANS}`; x.fillText(t.line, M, lineY);
  const st = J.end ? t.stamp : t.keep, col = J.end ? '#b8322f' : '#2e6b4f';
  x.save(); x.translate(W - 240, H - 470); x.rotate(-12 * Math.PI / 180); x.globalAlpha = .84; x.strokeStyle = col; x.lineWidth = 8; x.fillStyle = col;
  x.font = `700 ${L === 'ko' ? 64 : 44}px ${SANS}`; const sw = x.measureText(st).width + (L === 'ko' ? 44 : 34);
  x.strokeRect(-sw / 2, -54, sw + 20, 108); x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(st, 10, 4); x.restore();
  x.textAlign = 'left'; x.textBaseline = 'top';
  x.fillStyle = '#cfc9bd'; x.fillRect(M, H - 118, CW, 2); x.fillStyle = '#6b6a70'; x.font = `500 22px ${MONO}`; if(x.measureText(t.foot).width > CW) x.font = `500 19px ${MONO}`; x.fillText(t.foot, M, H - 94);
  $('#actions').hidden = false; blob = null;
  cv.toBlob(b => { blob = b; }, 'image/png');
  track('notice', {job, hrv: J.hrv, day: J.end || 0});
}
$('#go').onclick = () => { const j = $('#job').value.trim(); if(!j) return toast(T[L].need); render(j); };
$('#job').addEventListener('keydown', e => { if(e.key === 'Enter') $('#go').click(); });
async function getBlob(){ if(blob) return blob; const cv = $('#card canvas'); return new Promise(r => cv.toBlob(r, 'image/png')); }
$('#share').onclick = async () => { if(!cur) return; track('notice_share', {job: cur}); const text = T[L].shareText(cur), url = GAME_URL + 'notice.html?src=share' + (L === 'en' ? '&lang=en' : '');
  try{ if(navigator.share){ const b = await getBlob(); const f = new File([b], 'blue-hour-notice.png', {type:'image/png'}); const data = (navigator.canShare && navigator.canShare({files:[f]})) ? {files:[f], text, url} : {title:'BLUE HOUR 2029', text, url}; await navigator.share(data); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
  try{ await navigator.clipboard.writeText(text + '\n' + url); toast(T[L].copied); }catch(e){ toast(text + ' ' + url); } };
$('#save').onclick = async () => { if(!cur) return; track('notice_save', {job: cur}); const b = await getBlob(); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'blue-hour-notice.png'; document.body.appendChild(a); a.click(); a.remove(); toast(T[L].saved); };
$('#play').onclick = () => { track('notice_go', {job: cur || ''}); };
ui();
track('notice_open');
</script>
</body>
</html>
